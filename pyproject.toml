[project]
name = "agent-evaluation-demystified"
version = "0.1.0"
description = "Hands-on material for evaluating RAG systems, tool-calling agents and multi-turn conversational agents: DeepEval, RAGAS, MLflow 3 GenAI and Arize Phoenix."
readme = "README.md"
requires-python = ">=3.12"

# Core: everything courses/ needs, and most of labs/.
# Install:  uv sync          (or: pip install -e .)
dependencies = [
    # Evaluation frameworks — the subject of this repo
    "deepeval>=4.1.8",          # courses/01, labs/rag-evaluation, labs/llm-as-judge
    "ragas>=0.4.3",             # courses/01 module 1.6, labs/rag-evaluation/ragas-scripts
    "mlflow>=3.15.1",           # courses/01 module 2.4, courses/02 (entire track)

    # LangChain / LangGraph — the systems under evaluation
    "langchain>=1.4.0",
    "langchain-core>=1.6.1",
    # LOAD-BEARING: ragas 0.4.3 hard-imports langchain_community.chat_models.vertexai,
    # which 0.4.2 deleted, so an unpinned resolve breaks `import ragas`. 0.4.1 still
    # ships it. Not 0.3.31 like course 03: the [databricks] extra's
    # unitycatalog-langchain needs langchain-community>=0.4.0,<=0.4.1.
    "langchain-community==0.4.1",
    "langchain-openai>=1.6.0",
    "langchain-chroma>=1.1.0",
    # Pinned, not floated: resolving ragas or mlflow can silently pull langgraph
    # back to 1.0.x, which drops langgraph.runtime.ExecutionInfo and breaks every
    # LangGraph notebook in courses/01 and labs/langgraph-agent-rag-eval.
    "langgraph==1.2.11",
    "langgraph-prebuilt>=1.0.10",

    # Models and data
    "openai>=2.24.0",
    "pandas>=2.2",
    "numpy>=2.4",
    "pydantic>=2.12",
    "datasets>=3.0",

    # Utilities
    "python-dotenv>=1.2",
    "requests>=2.32",
    "tqdm>=4.67",

    # Notebook environment. ipykernel alone (not the `jupyter` metapackage) is
    # enough to register this venv as a kernel for VS Code or an existing
    # Jupyter Lab — it skips ~80 packages a standalone server would need.
    "ipython>=8.30",
    "ipykernel",
]

[project.optional-dependencies]
# courses/01-rag-agent-tool-evaluation/13 — Phoenix tracing, evals and experiments
phoenix = [
    # courses/01-rag-agent-tool-evaluation/13_Production_Grade_Agent_Eval_Overview.ipynb is
    # written against Phoenix 20.x: phoenix.otel.register, phoenix.evals.create_classifier,
    # phoenix.client.Client (spans, datasets, experiments). 5.x-era APIs (llm_classify,
    # OpenAIModel, phoenix.experiments) are gone.
    "arize-phoenix>=20.19",
    "arize-phoenix-evals>=3.9",
    "arize-phoenix-client>=3.5",
    "arize-phoenix-otel>=0.17",
    "openinference-instrumentation-openai>=0.1",
    "openinference-instrumentation-langchain>=0.1",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "duckdb>=1.1",
    "nest-asyncio>=1.6",
]

# labs/agent-evaluation/crewai-travel-planner — the live app under evaluation
crewai = [
    "crewai>=0.80",
    "crewai-tools>=0.17",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "openpyxl>=3.1",        # reads trip_questions.xlsx
    "pytest>=8.3",
]

# courses/02-databricks-mlflow-evals against a real workspace
# (phases 0-5 and 9-10 run locally against SQLite and do not need these)
databricks = [
    "databricks-langchain>=0.20.0",
    "databricks-sdk>=0.135.0",
]

# labs/rag-evaluation Streamlit demos
apps = [
    "streamlit>=1.40",
    "streamlit-option-menu>=0.4",
]

# courses/03-agentic-eval-harness — the multilingual Chroma index and
# notebook 09's labelling panel. Embeddings come from OpenAI. Everything else that
# course needs (deepeval, ragas, langgraph, langchain-openai) is already core.
# That course also ships its own requirements.txt with EXACT pins, because
# notebooks 04-06 are written against specific RAGAS/DeepEval releases that
# renamed metric imports. Prefer that file if a metric import fails here.
agentic-eval = [
    "chromadb>=1.5",
    "ipywidgets>=8.1",
    "typing-extensions>=4.16",
]

dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.setuptools]
packages = ["shared"]
