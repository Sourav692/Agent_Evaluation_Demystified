# docs/ — keep the generated-by-hand things in step with their sources.
#
# Five checks, all free, no API key. The site build installs markdown from PyPI;
# the rest are stdlib only. None of them can spend money, and none touch the
# course-03 release gate.
#
#   drill-sync      QUESTION_BANK.md is canonical; evaluation-round-drill.html
#                   carries the same 35 questions and 19 cases as a quiz. They
#                   are two thirds phrase-identical, nothing generates one from
#                   the other, and four commits have already changed one side
#                   without the other.
#
#   index-coverage  INDEX.md is the repo's lookup table. An edit on 2026-09-20
#                   removed three of its sections while intending to remove
#                   one, and the question bank lost its entry in a pushed
#                   commit. Nothing noticed.
#
#   link-check      every relative link under docs/ still resolves.
#
#   page-dates      site/page-dates.json holds each published page's last-commit
#                   date. Vercel can't compute it (no git history), so it is
#                   stamped by the pre-commit hook; this catches a skipped hook.
#
#   site-output     builds the site and runs site/check_dist.py over it: share
#                   tags, one <h1>, no repo path as text, no dead link or
#                   #fragment, pinned CDN URLs. Vercel runs the same check, so a
#                   page that fails it never deploys. Installs markdown==3.7.

name: docs-sync

on:
  push:
    paths:
      - 'docs/**'
      - 'INDEX.md'
      - '.github/scripts/check_drill_sync.py'
      - '.github/scripts/check_index_coverage.py'
      - '.github/workflows/docs-sync.yml'
      - 'site/**'
      - 'vercel.json'
  pull_request:
    paths:
      - 'docs/**'
      - 'INDEX.md'
      - '.github/scripts/check_drill_sync.py'
      - '.github/scripts/check_index_coverage.py'
      - '.github/workflows/docs-sync.yml'
      - 'site/**'
      - 'vercel.json'

jobs:
  docs-consistency:
    name: docs stay consistent with their indexes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # page-dates needs every file's last commit

      - name: Drill matches the question bank
        run: python3 .github/scripts/check_drill_sync.py

      - name: INDEX.md covers everything in docs/
        run: python3 .github/scripts/check_index_coverage.py

      - name: Every relative link resolves
        run: |
          curl -sSfL https://raw.githubusercontent.com/Sourav692/skills/main/skills/link-check/scripts/check_links.py -o "$RUNNER_TEMP/check_links.py"
          python3 "$RUNNER_TEMP/check_links.py" docs

      - name: Page dates match git history
        run: python3 site/stamp_dates.py --check

      - name: The built site keeps its promises
        run: |
          python3 -m venv /tmp/sitebuild   # the runner's python refuses a global pip install
          /tmp/sitebuild/bin/pip install --quiet -r site/requirements.txt
          /tmp/sitebuild/bin/python site/build.py
          /tmp/sitebuild/bin/python site/check_dist.py --self-test
          /tmp/sitebuild/bin/python site/check_dist.py
