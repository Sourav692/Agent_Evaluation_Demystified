# docs/ — keep the generated-by-hand things in step with their sources.
#
# Three checks, all free, stdlib only, no API key and no network. None of them
# can spend money, and none touch the course-03 release gate.
#
#   drill-sync      QUESTION_BANK.md is canonical; evaluation-round-drill.html
#                   carries the same 35 questions and 19 cases as a quiz. They
#                   are two thirds phrase-identical, nothing generates one from
#                   the other, and four commits have already changed one side
#                   without the other.
#
#   index-coverage  INDEX.md is the repo's lookup table. An edit on 2026-09-20
#                   removed three of its sections while intending to remove
#                   one, and the question bank lost its entry in a pushed
#                   commit. Nothing noticed.
#
#   link-check      every relative link under docs/ still resolves.

name: docs-sync

on:
  push:
    paths:
      - 'docs/**'
      - 'INDEX.md'
      - '.github/scripts/check_drill_sync.py'
      - '.github/scripts/check_index_coverage.py'
      - '.github/workflows/docs-sync.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'INDEX.md'
      - '.github/scripts/check_drill_sync.py'
      - '.github/scripts/check_index_coverage.py'
      - '.github/workflows/docs-sync.yml'

jobs:
  docs-consistency:
    name: docs stay consistent with their indexes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Drill matches the question bank
        run: python3 .github/scripts/check_drill_sync.py

      - name: INDEX.md covers everything in docs/
        run: python3 .github/scripts/check_index_coverage.py

      - name: Every relative link resolves
        run: python3 .claude/skills/link-check/scripts/check_links.py docs
