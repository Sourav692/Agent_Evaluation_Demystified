# Every model this course calls, and where each one is served.
#
# To change a model or a provider, edit this file only. Each notebook's setup cell reads it with
# Python's tomllib; no notebook names a model or a URL itself.
#
# A role picks a provider by name; the provider gives the base URL and the environment variable
# that holds its key (keys stay in the repo-root .env). Every provider must speak the OpenAI API.
# After changing the app model, delete data/golden_runs.json: notebooks 04-10 score those cached runs.

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[providers.openai]
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[providers.nebius]
base_url = "https://api.tokenfactory.nebius.com/v1"
api_key_env = "NEBIUS_API_KEY"

# The model inside the agent under test (notebooks 01, 02, 04, 06, 08, 09).
[models.app]
provider = "openrouter"
name = "deepseek/deepseek-v4-flash-0731"
reasoning_effort = "none"        # plain answers and readable routing decisions; delete for a non-reasoning model
tool_reasoning_effort = "low"    # the tool-calling account agent thinks a little before picking a tool
# Sent with every request. On OpenRouter, "provider" pins one deployment, so every run hits the
# same weights at the same precision. Use {} for a provider with no routing options.
extra_body = { provider = { only = ["deepinfra"], quantizations = ["fp8"], allow_fallbacks = false } }

# The judge (notebooks 04-10). Keep it a different model family from the app, so it never
# grades its own answers. An instruct model: no thinking to switch off.
[models.judge]
provider = "openrouter"
name = "qwen/qwen3-235b-a22b-2507"
structured_outputs = true        # the endpoint enforces JSON schemas, so DeepEval may ask for one
extra_body = { provider = { only = ["nebius"], allow_fallbacks = false } }

# Turns text into vectors for search (notebooks 01-06, 08, 09). Changing it means rebuilding
# data/chroma_db/ with notebook 01: vectors from two embedding models don't mix.
[models.embedding]
provider = "openrouter"
name = "openai/text-embedding-3-small"

# Writes the synthetic golden-set questions (notebook 03, whose output is cached).
[models.generator]
provider = "openrouter"
name = "openai/gpt-4o"

# Plays the customer (notebook 08) and writes attack messages (notebook 09): volume, not judgement.
[models.simulator]
provider = "openrouter"
name = "openai/gpt-4o-mini"
structured_outputs = true        # DeepEval can't look up a provider-prefixed name, so say it here

# Moderation (notebook 09). OpenRouter has no moderation endpoint, so this stays on OpenAI (free).
[models.moderation]
provider = "openai"
name = "omni-moderation-latest"
